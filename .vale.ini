StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Microsoft, proselint, alex
Vocab = renovate-config

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex
# Microsoft.Terms covers the same phrases.
proselint.Cliches = NO
# Vale.Spelling owns spelling.
proselint.Spelling = NO

# Agent instructions are terse imperatives that the voice styles misread.
[{AGENTS.md,CLAUDE.md,.claude/**/*.md}]
BasedOnStyles = Vale
