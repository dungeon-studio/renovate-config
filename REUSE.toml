# Copyright and licensing for files that cannot carry inline SPDX headers.

version = 1
SPDX-PackageName = "renovate-config"
SPDX-PackageSupplier = "Alex Brandt <alunduil@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/dungeon-studio/renovate-config"

# Generated by mise lock, which overwrites inline SPDX headers.
[[annotations]]
path = ["mise.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alex Brandt <alunduil@gmail.com>"
SPDX-License-Identifier = "MIT"

# reuse lint walks every path git does not ignore, and nothing gitignores
# .claude/, so files a session leaves there fail the hook without this.
[[annotations]]
path = [".claude/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alex Brandt <alunduil@gmail.com>"
SPDX-License-Identifier = "MIT"

# JSON has no comment syntax to carry an inline header.
[[annotations]]
path = ["**.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alex Brandt <alunduil@gmail.com>"
SPDX-License-Identifier = "MIT"
