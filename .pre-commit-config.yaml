---
# SPDX-FileCopyrightText: 2026 Alex Brandt <alunduil@gmail.com>
# SPDX-License-Identifier: MIT

# pre-commit skips executables under a shims/ directory when detecting a
# system Node, so without this it builds its own through nodeenv instead of
# using the one mise.toml pins.
default_language_version:
  node: system

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, main]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  # The first hook installs the Packages .vale.ini declares; without it the
  # lint loads no rules and passes silently.
  - repo: https://github.com/vale-cli/vale
    rev: v3.27.0
    hooks:
      - id: vale
        name: vale sync
        args: [sync]
        pass_filenames: false
      - id: vale
        args: [--output=line, --minAlertLevel=error]
        types: [markdown]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse
        always_run: true

  # Online audits need a token, so only the offline ones run here.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        args: [--no-progress, --offline]

  - repo: local
    hooks:
      # The PyPI wheel ships a prebuilt binary, where upstream's hooks build
      # from Go source. jactionlint checks `run:` scripts only when
      # shellcheck is on PATH. Run without arguments, it finds the files it
      # lints.
      - id: jactionlint
        name: jactionlint
        entry: jactionlint
        language: python
        additional_dependencies: [jactionlint==2.6.0, shellcheck-py==0.11.0.1]
        files: ^\.github/workflows/
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  # The default `files` pattern skips presets, which are every JSON file at
  # the root except renovate.json. Without --no-global, the validator checks
  # a named file as self-hosted global config, not repository config.
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.235.1
    hooks:
      - id: renovate-config-validator
        files: ^[^/]+\.json$
        args: [--strict, --no-global]
